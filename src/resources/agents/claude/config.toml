# Claude Agent Configuration
# This file defines the agent identity, installation, and runtime requirements.

# Agent identifier - must match directory name and Containerfile stage
name = "claude"

# Human-readable description for menus and help text
description = "Anthropic Claude Code agent"

# Command to install the agent in the container
# Executed during image build as the agent user
install_cmd = "curl -fsSL https://claude.ai/install.sh | bash"

# Command to launch the agent
# Executed when starting an interactive session
launch_cmd = "claude --dangerously-skip-permissions"

# Default shell for the agent (full path)
# Used as the user's login shell and SHELL environment variable
shell = "/usr/bin/fish"

# Environment variables (array of KEY=value strings)
# Set in the container runtime environment
env_vars = [
    "PATH=/home/agent/.local/bin:$PATH",
    "SHELL=/usr/bin/fish"
]

# Command to launch the agent through hapi for mobile PTY bridging
# When CLI_API_TOKEN is set at runtime, the wrapper uses this instead of launch_cmd
hapi_cmd = "hapi --dangerously-skip-permissions"

# Agent-specific optional mounts (only used when mount_host_config = true in user config)
# These provide backward compatibility with host-based credential storage.
# New users should configure credentials via [agents.claude] api_key in .klotho.toml instead.
[[optional_mounts]]
src = "~/.claude"
dest = "/home/agent/.claude"
